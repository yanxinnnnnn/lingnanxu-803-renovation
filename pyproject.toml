[project]
name = "lingnanxu-803-renovation"
version = "0.1.0"
description = "Reproducible B0 estimated floorplan automation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "ezdxf==1.4.3",
  "PyYAML==6.0.3",
  "Pillow==11.3.0",
  "matplotlib==3.10.7",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
